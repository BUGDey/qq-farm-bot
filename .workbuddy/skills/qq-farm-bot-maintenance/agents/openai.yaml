# Codex / OpenAI 系 Agent 的能力声明（可选）
# 其他 Agent 忽略此文件即可，SKILL.md 本身已自描述，不依赖本文件。
interface:
  display_name: "QQ 农场挂机助手维护手册"
  short_description: "QQ 农场挂机助手的维护流程（活动适配 / TSDK / 协议恢复 / 配置表同步 / 部署 / 多用户，Windows+macOS）"
  default_prompt: "读 SKILL.md，按任务路由加载 references，需要定位官方源码时先跑 scripts/find-client-source.js。"

policy:
  # 与 SKILL.md 第二章红线一致
  - 官方 QQ 容器目录只读，先复制到临时目录再处理
  - 凭据、HAR、抓包、小程序包与原始缓存不进 Git
  - 不猜协议字段号；真实账号请求必须用户明确授权
  - 合并/导入源码前先跑 scripts/check-deletions.sh
