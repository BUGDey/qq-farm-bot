syntax = "proto3";

package gamepb.mallpb;

import "corepb.proto";

// 商场服务
service MallService {
  rpc GetMallListBySlotType(GetMallListBySlotTypeRequest) returns (GetMallListBySlotTypeResponse);
  rpc Purchase(PurchaseRequest) returns (PurchaseResponse);
  rpc GetMonthCardInfos(GetMonthCardInfosRequest) returns (GetMonthCardInfosReply);
  rpc ClaimMonthCardReward(ClaimMonthCardRewardRequest) returns (ClaimMonthCardRewardReply);
}

// 获取商场列表请求
message GetMallListBySlotTypeRequest {
  int32 slot_type = 1;  // 商场类型
}

// 获取商场列表响应
message GetMallListBySlotTypeResponse {
  repeated bytes goods_list = 1;  // 商品列表（每个是序列化的MallGoods）
  int64 timestamp = 2;  // 时间戳
}

// 限购信息（与官方 RestrictionType 对应）
message PurchaseLimit {
  int32 limit_type = 1;    // 1=每日，2=每周，3=每月，4=永久
  int64 bought_count = 2;  // 已购买数量
  int64 limit_count = 3;   // 限购上限
}

// 商品信息
message MallGoods {
  int32 goods_id = 1;        // 商品ID
  string name = 2;           // 商品名称
  int32 type = 3;            // 商品类型
  repeated bytes item_ids = 4; // 商品内的物品列表（每个是序列化的 corepb.Item）
  bytes price = 5;           // 价格（序列化数据）
  bool is_free = 6;          // 是否免费
  bytes limit = 7;           // 限购信息（序列化数据）
  bool is_limited = 8;       // 是否限购
  string discount = 9;       // 折扣信息
  bool is_activity = 10;     // 是否为活动商品
  int64 end_time = 11;       // 活动结束时间（Unix 秒）
  bool enabled = 12;         // 商品是否启用
}

// 购买请求
message PurchaseRequest {
  int32 goods_id = 1;  // 商品ID
  int32 count = 2;     // 购买数量
}

// 购买响应
message PurchaseResponse {
  int32 goods_id = 1;     // 商品ID
  int32 count = 2;        // 购买数量
  bytes reward_info = 3;  // 奖励信息
  bytes result = 5;       // 购买结果
}

// 月卡信息
message GetMonthCardInfosRequest {}

message MonthCardInfo {
  int32 goods_id = 1;
  corepb.Item reward = 2;
  bool can_claim = 3;
}

message GetMonthCardInfosReply {
  repeated MonthCardInfo infos = 1;
}

// 领取月卡奖励
message ClaimMonthCardRewardRequest {
  int32 goods_id = 1;
}

message ClaimMonthCardRewardReply {
  repeated corepb.Item items = 1;
}

// ============ 牧场商城（slot_type=6）官方字段布局 ============
// 上面 MallGoods / PurchaseRequest / PurchaseResponse 是农场商城在用的私有
// 字节布局（price / limit / item_ids 都是 bytes），不能改，否则农场商城直接
// 解析失败。牧场每日福利与罐头商店走的是官方字段，这里用独立 message 承接，
// 同一份 goods_list 用 RanchMallGoods 解码，互不影响。

// 牧场商城列表请求（官方字段：1=slot_type，2=是否手动打开，3=场景）
message RanchMallListRequest {
  int32 slot_type = 1;
  bool is_manual_open = 2;
  int32 global_scene_id = 3;
}

// 牧场商城商品（官方 MallGoods 字段布局）
message RanchMallGoods {
  int64 goods_id = 1;
  string name = 2;
  int32 goods_type = 3;
  repeated corepb.Item reward_items = 4;
  corepb.Item price = 5;              // id 是货币，count 是单价
  bool is_free = 6;
  PurchaseLimit purchase_limit = 7;
  bool is_available = 8;
  string discount_text = 9;
  bool is_discounted = 10;
  int64 discount_end_time = 11;
  int32 product_type = 12;            // 1=普通 2=宠物 3=装扮
  string pic = 13;
  corepb.Item discount_price = 14;
  int64 promotion_start_time = 15;
  int64 promotion_end_time = 16;
  int64 ad_id = 17;
  bool ad_only = 18;
  RanchMallShareInfo share = 19;
  bool is_owned = 20;
  string bg_pic = 21;
  string color = 22;
}

// 牧场商城分享限制
message RanchMallShareInfo {
  int64 share_id = 1;
  int64 share_free_count = 2;
  int32 share_status = 3;
  bool share_only = 4;
}

// 牧场商城购买请求
message RanchMallPurchaseRequest {
  int64 goods_id = 1;
  int64 count = 2;
}

// 牧场商城购买响应
message RanchMallPurchaseResponse {
  int64 goods_id = 1;
  bool success = 2;
  repeated corepb.Item reward_items = 3;
  bool is_first_buy = 4;
  PurchaseLimit purchase_limit = 5;
  bool share_free = 6;
  RanchMallShareInfo share = 7;
}
