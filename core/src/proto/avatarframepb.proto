syntax = "proto3";

package gamepb.avatarframepb;

// ============ 头像框信息 ============
message AvatarFrame {
    int64 frame_id = 1;
    int64 status = 2;       // 这里实际就是 frame_type（1 头像框 / 2 铭牌）
    int64 equipped = 3;
    int64 expire_time = 4;  // 剩余天数
}

// ============ 查询 ============
message AvatarFramesOwnedRequest {
    int32 frame_type = 1;
}

message AvatarFramesOwnedReply {
    repeated AvatarFrame frames = 1;
}

// ============ 装备 / 卸下 ============
// 抓包实证：Equip 与 Unequip 的请求体都只有 frame_id 一个字段
// （铭牌 401005 → `08 ed bc 18`），头像框与铭牌都走这个服务。
message EquipRequest {
    int64 frame_id = 1;
}

message EquipReply {
    repeated AvatarFrame frames = 1;
}

message UnequipRequest {
    int64 frame_id = 1;
}

message UnequipReply {
    repeated AvatarFrame frames = 1;
}

// ============ 更换头像框（旧 → 新） ============
// 抓包实证：请求体是两个 int64，`08 f1 10 10 f3 10` = 2161 → 2163
message UpdateEquipRequest {
    int64 frame_id = 1;     // 当前佩戴的 id
    int64 frame_type = 2;   // 要换上的 id（字段名沿用旧命名，语义是「新 id」）
}

// 备选字段顺序（仅保留给兼容旧代码用）
message UpdateEquipAltRequest {
    int64 frame_type = 1;
    int64 frame_id = 2;
}

message UpdateEquipReply {
    repeated AvatarFrame frames = 1;
}

// ============ 通知 ============
message AvatarFrameRedDotNotify {
    int32 frame_type = 2;
}