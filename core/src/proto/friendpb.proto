syntax = "proto3";

package gamepb.friendpb;

// ============ 好友农场摘要信息 ============
message Plant {
    int64 dry_time_sec = 1;      // 缺水时间（真实回包为 Unix 秒时间戳）
    int64 weed_time_sec = 2;     // 长草时间（真实回包为 Unix 秒时间戳）
    int64 insect_time_sec = 3;   // 生虫时间（真实回包为 Unix 秒时间戳）
    int64 ripe_time_sec = 4;     // 最近成熟时间（若返回，按 Unix 秒时间戳处理）
    int64 ripe_fruit_id = 5;     // 成熟果实ID
    int64 steal_plant_num = 6;   // 可偷数量
    int64 dry_num = 7;           // 缺水地块数
    int64 weed_num = 8;          // 有草地块数
    int64 insect_num = 9;        // 有虫地块数
}

// ============ 标签 ============
message Tags {
    bool is_new = 1;
    bool is_follow = 2;
}

// ============ 好友信息 ============
message GameFriend {
    int64 gid = 1;
    string open_id = 2;
    string name = 3;
    string avatar_url = 4;
    string remark = 5;
    int64 level = 6;
    int64 gold = 7;
    Tags tags = 8;
    Plant plant = 9;
    int32 authorized_status = 10;
    // field 11 reserved
    // Illustrated illustrated = 12;  // 略
    // repeated AvatarFrame equip_avatar_frames = 13;  // 略
}

// ============ 请求/回复 ============

// --- 获取所有好友 ---
message GetAllRequest {
    // 官方客户端每次都发 field1=1（抓包实测：请求体 0801）。
    // 缺这个字段时服务端只回极少量好友，加了才给全量。
    uint32 sync_flag = 1;
}

message GetAllReply {
    repeated GameFriend game_friends = 1;
    // repeated Invitation invitations = 2;  // 略
    int64 application_count = 3;
}

// --- 获取指定游戏好友 (通过GID列表) ---
message GetGameFriendsRequest {
    repeated int64 gids = 1;
    // 官方客户端每次都带 1（抓包实测：f1=gids, f2=1）。
    uint32 sync_flag = 2;
}

// ============ 推荐好友（服务端可能随 SyncAll 一起下发） ============
message RecommendedFriend {
    int64 gid = 1;
    string name = 2;
    string avatar_url = 3;
    int64 level = 4;
    int64 updated_at = 5;
    string open_id = 6;
}

// --- 同步好友 (带 open_ids) ---
message SyncAllRequest {
    // field 1 reserved
    repeated string open_ids = 2;
    // 官方客户端每次 SyncAll 都带 1（抓包实测：275 个 open_id + field3=1）。
    // 含义未公开，但对端据此决定「这是不是一次完整同步」，缺了它只回极少条目。
    uint32 sync_flag = 3;
}

message SyncAllReply {
    repeated GameFriend game_friends = 1;
    // repeated Invitation invitations = 2;  // 略
    int64 application_count = 3;
    repeated RecommendedFriend recommended_friends = 5;
}

// ============ 好友申请 (微信同玩) ============

// 申请信息
message Application {
    int64 gid = 1;
    int64 time_at = 2;
    string open_id = 3;
    string name = 4;
    string avatar_url = 5;
    int64 level = 6;
    // repeated AvatarFrame equip_avatar_frames = 7;  // 略
}

// --- 获取好友申请列表 ---
message GetApplicationsRequest {}

message GetApplicationsReply {
    repeated Application applications = 1;
    bool block_applications = 2;  // 是否屏蔽申请
}

// --- 同意好友申请 ---
message AcceptFriendsRequest {
    repeated int64 friend_gids = 1;
}

message AcceptFriendsReply {
    repeated GameFriend friends = 1;
}

// --- 通过分享链接主动加好友 ---
// 抓包实证（2026-11-21 00:18, Reqable #334）：先 VisitService.Enter(reason=5,
// share_key) 拿回包顶层 field 10 的 apply_token，原样作为 apply_token 发回。
message ApplyFriendRequest {
    int64 gid = 1;           // 对方 GID
    string apply_token = 2;  // VisitService.Enter 回包的 apply_token
    int32 source = 3;        // 抓包: 0
}

message ApplyFriendReply {}

// --- 拒绝好友申请 ---
message RejectFriendsRequest {
    repeated int64 friend_gids = 1;
}

message RejectFriendsReply {}

// --- 删除好友 ---
// 抓包样例: gamepb.friendpb.FriendService.DelFriend
message DelFriendRequest {
    int64 friend_gid = 1;
}

message DelFriendReply {}

// --- 设置屏蔽申请 ---
message SetBlockApplicationsRequest {
    bool block = 1;
}

message SetBlockApplicationsReply {
    bool block = 1;
}

// ============ 服务器推送通知 ============

// 收到好友申请通知
message FriendApplicationReceivedNotify {
    repeated Application applications = 1;
}

// 好友添加成功通知 (对方同意后)
message FriendAddedNotify {
    repeated GameFriend friends = 1;
}
