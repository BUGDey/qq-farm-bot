services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"               # 管理面板
      - "18000:18000"             # 抓包登录 MITM 代理端口（默认关闭，启用后供手机 Wi-Fi 代理连入）

    volumes:
      # 数据固定落在项目内的 ./data，与部署位置无关，备份只需打包这一个目录
      - ./data:/app/core/data
      - ./data/napcat/auth:/app/napcat-auth:ro

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"
      NAPCAT_LOGIN_ENABLED: "${NAPCAT_LOGIN_ENABLED:-false}"
      NAPCAT_WEBUI_URL: http://napcat:6099/api
      NAPCAT_OPENAUTH_URL: http://napcat:6099/plugin/qq-miniapp-openauth/api
      # ---- 多用户账号与卡密体系 ----
      # 关闭后退回单机模式（auto-login 可用，不做用户校验）
      FARM_USER_SYSTEM_ENABLED: "${FARM_USER_SYSTEM_ENABLED:-true}"
      # 内置管理员初始凭据。密码设为必填，避免无人值守时落到弱口令：
      # 未设置会在启动时直接报错，请先用 ./start.sh 生成 .env，或手动在 .env 中设置强密码。
      FARM_ADMIN_USERNAME: "${FARM_ADMIN_USERNAME:-admin}"
      FARM_ADMIN_PASSWORD: "${FARM_ADMIN_PASSWORD:?请先在 .env 中设置 FARM_ADMIN_PASSWORD（请勿使用弱口令）}"
      # 超级管理员（可选，留空则不启用）
      # FARM_SUPER_ADMIN_USERNAME: "superadmin"
      # FARM_SUPER_ADMIN_PASSWORD: "<请设置一个强密码>"
      # 是否开放自助注册 / 免登录续费 / 卡密找回密码
      FARM_ALLOW_REGISTER: "${FARM_ALLOW_REGISTER:-true}"
      FARM_ALLOW_PUBLIC_RENEW: "${FARM_ALLOW_PUBLIC_RENEW:-true}"
      FARM_ALLOW_PUBLIC_RESET_PASSWORD: "${FARM_ALLOW_PUBLIC_RESET_PASSWORD:-true}"
      # 新用户默认可添加的农场账号数量
      FARM_DEFAULT_ACCOUNT_LIMIT: "${FARM_DEFAULT_ACCOUNT_LIMIT:-2}"
      # 抓包服务默认关闭；在面板“系统配置 → Code/GID 抓取服务”开启后才会运行。
      # 代理端口固定使用 18000：
      # CAPTURE_PORTS: "18000"
      # 需要固定对外地址时，在 .env 中设置（局域网 / Tailscale 可同时填写）：
      # CAPTURE_ADVERTISE_IPS=192.168.1.100,100.64.0.2

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    profiles: ["napcat"]
    build:
      context: .
      dockerfile: napcat/Dockerfile
      args:
        NAPCAT_IMAGE: "${NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.19}"
    image: qq-farm-napcat:latest
    container_name: qq-farm-napcat
    hostname: "${NAPCAT_DEVICE_NAME:-qq-farm-bot}"
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
    ports:
      # NapCat WebUI：默认只监听本机，且会走 NapCat 自带的 Token 校验
      - "${NAPCAT_WEBUI_HOST:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/QQ:/app/.config/QQ
      - ./data/napcat/auth:/app/napcat-auth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
